# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required for Tuist OIDC authentication
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v4

    - name: Cache Tuist dependencies
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
        key: tuist-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved') }}

    - name: Log in Tuist
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    - name: Setup Tuist Cache Service
      run: |
        tuist setup cache

    # Boot the simulator up front so a slow or stuck boot fails here, visibly,
    # instead of hanging silently after "Testing started".
    - name: Boot Simulator
      timeout-minutes: 10
      run: |
        # Newest plain iOS runtime (skips device-specific ones like iOS-27-2-iPhone19-4)
        DEVICE_JSON=$(xcrun simctl list devices available --json | jq -c '
          [.devices | to_entries[]
            | select(.key | test("iOS-[0-9]+-[0-9]+$"))
            | .key as $runtime
            | .value[]
            | select(.name | startswith("iPhone"))
            | . + {os: ($runtime | capture("iOS-(?<v>[0-9]+-[0-9]+)$").v | gsub("-"; "."))}]
          | sort_by(.os | split(".") | map(tonumber)) | last')
        if [ -z "$DEVICE_JSON" ] || [ "$DEVICE_JSON" = "null" ]; then
          echo "::error::No available iPhone simulator found"
          xcrun simctl list devices available
          exit 1
        fi
        UDID=$(echo "$DEVICE_JSON" | jq -r '.udid')
        NAME=$(echo "$DEVICE_JSON" | jq -r '.name')
        OS=$(echo "$DEVICE_JSON" | jq -r '.os')
        echo "Booting $NAME (iOS $OS) $UDID"
        xcrun simctl boot "$UDID" || true
        xcrun simctl bootstatus "$UDID" -b
        echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
        echo "SIM_OS=$OS" >> "$GITHUB_ENV"

    - name: Build & Test App
      timeout-minutes: 30
      env:
        SCHEME: App
      run: |
        tuist test --device "$SIM_NAME" --os "$SIM_OS"
